<header class="site-header">
  <!-- Main bar: light background, logo | nav | Login + Book a Call -->
  <div class="site-header-main">
    <div class="site-header-inner">
      <a
        href="/"
        class="site-header-logo"
        aria-label="McGeorge Consulting home"
      >
        <img src="./img/logo.svg" alt="McGeorge Consulting Ltd" />
      </a>

      <nav class="site-header-nav" aria-label="Main navigation">
        <a href="#" class="site-header-link"> Why McGeorge </a>
        <a href="#" class="site-header-link">
          Services
          <img
            src="./img/chevron-down-green.svg"
            alt=""
            aria-hidden="true"
            class="site-header-link-icon"
          />
        </a>
        <a href="#" class="site-header-link"> Industries </a>
        <a href="#" class="site-header-link"> Products </a>
        <a href="#" class="site-header-link">Insight</a>
        <a href="./career.html" class="site-header-link"> Career </a>
        <div class="site-header-mobile-actions">
          <a href="#" class="site-header-login">
            <img
              src="./img/login.svg"
              alt=""
              aria-hidden="true"
              class="site-header-login-icon"
            />
            Login
          </a>
          <button type="button" class="btn btn-primary btn-lg">
            Book a Call
            <img
              src="./img/arrow-right.svg"
              alt=""
              aria-hidden="true"
              class="site-header-cta-icon"
            />
          </button>
        </div>
      </nav>

      <div class="site-header-actions">
        <a href="#" class="site-header-login">
          <img
            src="./img/login.svg"
            alt=""
            aria-hidden="true"
            class="site-header-login-icon"
          />
          Login
        </a>
        <button type="button" class="btn btn-primary btn-lg site-header-cta">
          Book a Call
          <img
            src="./img/arrow-right.svg"
            alt=""
            aria-hidden="true"
            class="site-header-cta-icon"
          />
        </button>
      </div>

      <button
        type="button"
        class="site-header-toggle"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <svg
          class="hamburger-icon"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <svg
          class="close-icon"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="display: none"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  </div>
</header>
